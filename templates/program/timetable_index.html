<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>タイムテーブル一覧</title>
  <style>
    *{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f4f6f8;color:#17212b;margin:0}
    header{background:#17324d;color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
    h1{font-size:1.4rem;margin:0}
    .login-button{display:inline-block;background:#fff;color:#17324d;border-radius:6px;padding:.6rem 1rem;text-decoration:none;font-weight:700}
    .login-button:hover{background:#dcecf7}a:focus-visible{outline:3px solid #63afd4;outline-offset:3px}
    main{padding:1.5rem;max-width:700px}
    .meeting{display:block;background:#fff;border:1px solid #cbd5df;border-radius:8px;padding:1rem;margin-bottom:.75rem;color:#17324d;text-decoration:none}
    .meeting:hover{background:#e8eef5}.meeting small{display:block;color:#526070;margin-top:.4rem}
  </style>
</head>
<body>
  <header>
    <h1>タイムテーブル一覧</h1>
    <nav aria-label="アカウント">
      {% if request.user.is_authenticated %}
      <a class="login-button" href="{% url 'organize_index' %}">プログラム編成へ</a>
      {% else %}
      <a class="login-button" href="{% url 'login' %}">ログイン</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for meeting in meetings %}
    <a class="meeting" href="{% url 'timetable' meeting.year %}"><strong>{{ meeting.name }}</strong><small>{{ meeting.start_date }}〜{{ meeting.end_date }}　{{ meeting.location }}</small></a>
    {% empty %}
    <p>年会情報がありません。</p>
    {% endfor %}
  </main>
</body>
</html>
