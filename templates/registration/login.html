<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>編成ページにログイン</title>
<style>
body{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;background:#f3f6fa;color:#203142;margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem}
main{width:min(400px,100%);background:#fff;border:1px solid #d6e0e9;border-radius:14px;padding:1.5rem;box-shadow:0 18px 50px #17324d1c}
h1{font-size:1.3rem;margin:0 0 1rem}p{display:flex;flex-direction:column;gap:.35rem}label{font-weight:700;font-size:.9rem}
input{font:inherit;padding:.7rem;border:1px solid #bccbd8;border-radius:9px}input:focus{outline:3px solid #85c4df;border-color:#24749d}
button{width:100%;background:#24749d;color:#fff;border:0;border-radius:9px;padding:.75rem;font:inherit;font-weight:700;cursor:pointer}
button:hover{background:#185979}.errorlist{color:#b73535}a{color:#185979}
</style></head><body><main><h1>編成ページにログイン</h1>
{% if form.errors %}<p>ユーザー名またはパスワードを確認してください。</p>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button type="submit">ログイン</button></form>
<p><a href="{% url 'timetable_index' %}">公開タイムテーブルへ</a></p>
</main></body></html>
