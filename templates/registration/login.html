{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ログイン | プログラム編成システム</title>
  <link rel="stylesheet" href="{% static 'program/login.css' %}">
</head>
<body>
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">P</div>
    <p class="eyebrow">加速器学会年会</p>
    <h1>プログラム編成システム</h1>
    <p class="intro">登録済みのアカウントでログインして、<br>年会のプログラムを編成します。</p>
    {% if form.errors %}
    <div class="error" role="alert">ユーザー名またはパスワードを確認してください。</div>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="id_username">ユーザー名</label>
        <input type="text" name="username" id="id_username" value="{{ form.username.value|default_if_none:'' }}" autocomplete="username" maxlength="150" required autofocus>
      </div>
      <div class="field">
        <label for="id_password">パスワード</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <button type="submit">ログイン</button>
    </form>
    <a class="back-link" href="{% url 'password_reset' %}">パスワードを忘れた方はこちら</a>
    <a class="back-link" href="{% url 'timetable_index' %}">← 公開タイムテーブルへ戻る</a>
  </main>
</body>
</html>
