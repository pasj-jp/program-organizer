{% extends 'registration/password_reset_base.html' %}
{% block content %}
<h1>パスワードをお忘れですか？</h1>
<p class="intro">登録メールアドレスを入力してください。パスワード再設定用のリンクをお送りします。</p>
<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <div class="field">
    <label for="{{ form.email.id_for_label }}">登録メールアドレス</label>
    {{ form.email }}{{ form.email.errors }}
  </div>
  <button type="submit">再設定メールを送信</button>
</form>
{% endblock %}
