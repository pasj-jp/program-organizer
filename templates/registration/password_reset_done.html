{% extends 'registration/password_reset_base.html' %}
{% block content %}
<h1>メールをご確認ください</h1>
<p class="intro">入力したメールアドレスが有効なアカウントに登録されている場合、再設定メールを送信しました。メール内のリンクから新しいパスワードを設定してください。リンクの有効期限は1時間です。</p>
<p class="intro">メールが届かない場合は、迷惑メールフォルダーと入力したアドレスをご確認ください。メールアドレスを登録していない場合は管理者にお問い合わせください。</p>
<a class="back-link" href="{% url 'password_reset' %}">メールアドレスを入力し直す</a>
{% endblock %}
