name: Django tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: program_org
          POSTGRES_USER: program_org
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DB_ENGINE: ${{ matrix.database }}
      DJANGO_DB_NAME: ${{ matrix.database == 'postgresql' && 'program_org' || 'db.sqlite3' }}
      DJANGO_DB_USER: program_org
      DJANGO_DB_PASSWORD: test-only-password
      DJANGO_DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
